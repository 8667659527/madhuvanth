[project]
name = "motor-faulty-prediction"
version = "0.1.0"
description = "ESP32 motor sensor monitoring and demo fault-prediction dashboard"
readme = "README.md"
authors = [
    { name = "8667659527", email = "nithishp883@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "joblib>=1.3",
    "pandas>=2.0",
    "pyserial>=3.5",
    "streamlit>=1.37",
    "scikit-learn>=1.4",
    "reportlab>=4",
]

[project.scripts]
motor-faulty-prediction = "motor_faulty_prediction:main"
motor-faulty-prediction-serial = "motor_faulty_prediction.serial_receiver:main"
motor-faulty-prediction-dashboard = "motor_faulty_prediction.dashboard:launch"
motor-faulty-prediction-train-model = "motor_faulty_prediction.train_model:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
